services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: vista_e2e
      POSTGRES_PASSWORD: local-e2e-only
      POSTGRES_DB: vista_e2e
    ports: ['127.0.0.1:58432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vista_e2e -d vista_e2e']
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7.4.5-alpine
    ports: ['127.0.0.1:58379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 30
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data
    environment:
      MINIO_ROOT_USER: vista-e2e
      MINIO_ROOT_PASSWORD: local-e2e-storage-only
    ports: ['127.0.0.1:58900:9000']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mc alias set --api S3v4 health http://localhost:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1 && mc ready health --quiet',
        ]
      interval: 2s
      timeout: 2s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ['127.0.0.1:58025:1025']
