name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_DB: vista_ci
          POSTGRES_PASSWORD: vista-ci-only
          POSTGRES_USER: vista
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vista -d vista_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      BUSINESS_TIMEZONE: Europe/Sofia
      CORS_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql://vista:vista-ci-only@localhost:5432/vista_ci
      NODE_ENV: test
      REDIS_URL: redis://localhost:6379/15
      RUN_DATABASE_TESTS: 'true'
      RUN_INFRASTRUCTURE_TESTS: 'true'
      S3_ACCESS_KEY_ID: ci-only
      S3_BUCKET: vista-ci
      S3_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_REGION: us-east-1
      S3_SECRET_ACCESS_KEY: ci-only-not-a-production-secret
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      SMTP_FROM: ci@example.invalid
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      TOTP_ENCRYPTION_KEY: ci-only-totp-key-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Start S3-compatible test storage
        run: |
          docker run --detach --name vista-ci-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=ci-only \
            --env MINIO_ROOT_PASSWORD=ci-only-not-a-production-secret \
            minio/minio:RELEASE.2025-07-23T15-54-02Z server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:9000/minio/health/live >/dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker logs vista-ci-minio
              exit 1
            fi
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh \
            --env S3_ACCESS_KEY_ID=ci-only \
            --env S3_BUCKET=vista-ci \
            --env S3_SECRET_ACCESS_KEY=ci-only-not-a-production-secret \
            minio/mc:RELEASE.2025-07-21T05-28-08Z -c \
            'mc alias set vista http://localhost:9000 "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY" && mc mb --ignore-existing "vista/$S3_BUCKET" && mc anonymous set none "vista/$S3_BUCKET"'
      - run: npm run db:migrate
      - run: npm run validate
      - name: Roll back and reapply the latest migration
        run: |
          npm run db:rollback
          npm run db:migrate
