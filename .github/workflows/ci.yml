name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  application-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [api, operations, pos, recovery]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infrastructure/deployment/Dockerfile --target ${{ matrix.target }} -t vista-${{ matrix.target }}:ci .
      - name: Scan built application image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: vista-${{ matrix.target }}:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: json
          output: application-vulnerabilities.json
          timeout: 15m
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.target }}-vulnerabilities
          path: application-vulnerabilities.json
          retention-days: 7
  deployment-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:deployment
  container-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npm run test:container-security
      - run: npx tsc -p tests/security/tsconfig.json
      - id: images
        name: Read versioned images without loading local credentials
        run: |
          matrix=$(node --import tsx tests/security/container-images.ts)
          test -n "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  container-security:
    needs: container-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.container-inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Scan operating system and library vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: ${{ matrix.image }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: json
          output: container-vulnerabilities.json
          timeout: 15m
      - name: Retain scan evidence even when vulnerabilities are found
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-vulnerabilities
          path: container-vulnerabilities.json
          if-no-files-found: warn
          retention-days: 7
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install PDF text and rendering validation tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm run build:packages
      - run: npm run build -w @vista/api
      - run: npx tsc --project tests/e2e/tsconfig.json --noEmit
      - run: npm run test:acceptance
      - name: Browser failure evidence (disposable test data only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            test-results/browser
            playwright-report
          retention-days: 3
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_DB: vista_ci
          POSTGRES_PASSWORD: vista-ci-only
          POSTGRES_USER: vista
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vista -d vista_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      BUSINESS_TIMEZONE: Europe/Sofia
      CORS_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql://vista:vista-ci-only@localhost:5432/vista_ci
      NODE_ENV: test
      REDIS_URL: redis://localhost:6379/15
      RUN_DATABASE_TESTS: 'true'
      RUN_INFRASTRUCTURE_TESTS: 'true'
      S3_ACCESS_KEY_ID: ci-only
      S3_BUCKET: vista-ci
      S3_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_REGION: us-east-1
      S3_SECRET_ACCESS_KEY: ci-only-not-a-production-secret
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      SMTP_FROM: ci@example.invalid
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      TOTP_ENCRYPTION_KEY: ci-only-totp-key-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build:packages
      - run: npm run build -w @vista/api
      - name: Start S3-compatible test storage
        run: |
          docker run --detach --name vista-ci-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=ci-only \
            --env MINIO_ROOT_PASSWORD=ci-only-not-a-production-secret \
            minio/minio:RELEASE.2025-07-23T15-54-02Z server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:9000/minio/health/live >/dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker logs vista-ci-minio
              exit 1
            fi
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh \
            --env S3_ACCESS_KEY_ID=ci-only \
            --env S3_BUCKET=vista-ci \
            --env S3_SECRET_ACCESS_KEY=ci-only-not-a-production-secret \
            minio/mc:RELEASE.2025-07-21T05-28-08Z -c \
            'mc alias set vista http://localhost:9000 "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY" && mc mb --ignore-existing "vista/$S3_BUCKET" && mc anonymous set none "vista/$S3_BUCKET"'
      - run: npm run db:migrate
      - run: npm run validate
      - name: Roll back and reapply the latest migration
        run: |
          npm run db:rollback
          npm run db:migrate
