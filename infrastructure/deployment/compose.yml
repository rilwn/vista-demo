# Local-only deployment rehearsal. Public/TLS deployment requires DEP-001.
services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: vista
      POSTGRES_DB: vista
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U vista -d vista']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.5-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: vista-storage
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
    volumes: [files-data:/data]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 3s
      retries: 20
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio: { condition: service_healthy }
    environment:
      STORAGE_SECRET: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
    entrypoint: [/bin/sh, -c]
    command:
      [
        'mc alias set rehearsal http://minio:9000 vista-storage "$$STORAGE_SECRET" && mc mb --ignore-existing rehearsal/vista-files && mc anonymous set none rehearsal/vista-files',
      ]
  mailpit:
    image: axllent/mailpit:v1.27.8
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    image: vista-api:${VISTA_IMAGE_TAG:?Set VISTA_IMAGE_TAG}
    build: { context: ../.., dockerfile: infrastructure/deployment/Dockerfile, target: api }
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: '3000'
      API_RATE_LIMIT_STORE: redis
      BUSINESS_TIMEZONE: Europe/Sofia
      CORS_ORIGINS: http://127.0.0.1:${OPERATIONS_PORT:-5473},http://127.0.0.1:${POS_PORT:-5474},http://127.0.0.1:${RECOVERY_PORT:-5475}
      DATABASE_URL: postgresql://vista:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/vista
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Set TOTP_ENCRYPTION_KEY}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: vista-storage
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
      S3_BUCKET: vista-files
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_FROM: rehearsal@example.invalid
      DEV_FIXTURES_ENABLED: 'false'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
  operations:
    image: vista-operations:${VISTA_IMAGE_TAG:?Set VISTA_IMAGE_TAG}
    build: { context: ../.., dockerfile: infrastructure/deployment/Dockerfile, target: operations }
    ports: ['127.0.0.1:${OPERATIONS_PORT:-5473}:8080']
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    depends_on:
      api: { condition: service_healthy }
  pos:
    image: vista-pos:${VISTA_IMAGE_TAG:?Set VISTA_IMAGE_TAG}
    build: { context: ../.., dockerfile: infrastructure/deployment/Dockerfile, target: pos }
    ports: ['127.0.0.1:${POS_PORT:-5474}:8080']
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    depends_on:
      api: { condition: service_healthy }
  recovery:
    image: vista-recovery:${VISTA_IMAGE_TAG:?Set VISTA_IMAGE_TAG}
    build: { context: ../.., dockerfile: infrastructure/deployment/Dockerfile, target: recovery }
    ports: ['127.0.0.1:${RECOVERY_PORT:-5475}:8080']
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres-data:
  redis-data:
  files-data:
