# Coolify staging/production stack. Configure every ${...} value in Coolify;
# do not create a server .env file or publish ports for internal services.
services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: vista
      POSTGRES_DB: vista
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U vista -d vista']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.5-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: vista-storage
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in Coolify}
    volumes: [files-data:/data]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'mc alias set --api S3v4 health http://localhost:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1 && mc ready health --quiet',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: vista-api:${VISTA_IMAGE_TAG:?Set VISTA_IMAGE_TAG in Coolify}
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    depends_on:
      minio: { condition: service_healthy }
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: vista-storage
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in Coolify}
      S3_BUCKET: vista-files
      BACKUP_S3_BUCKET: vista-backups
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
    command: [node, apps/api/dist/storage/ensure-bucket.js]
    restart: 'no'

  # Staging email capture only. It is intentionally not assigned a public domain.
  mailpit:
    image: axllent/mailpit:v1.27.8
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: vista-api:${VISTA_IMAGE_TAG:?Set VISTA_IMAGE_TAG in Coolify}
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    environment:
      DATABASE_URL: postgresql://vista:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}@postgres:5432/vista
    command: [node, apps/api/dist/database/migrate.js, up]
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    image: vista-api:${VISTA_IMAGE_TAG:?Set VISTA_IMAGE_TAG in Coolify}
    build: { context: ., dockerfile: infrastructure/deployment/Dockerfile, target: api }
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: production
      VISTA_DEPLOYMENT_STAGE: ${VISTA_DEPLOYMENT_STAGE:?Set VISTA_DEPLOYMENT_STAGE in Coolify}
      POS_FISCAL_SIMULATOR_ENABLED: ${POS_FISCAL_SIMULATOR_ENABLED:-false}
      API_HOST: 0.0.0.0
      API_PORT: '3000'
      API_RATE_LIMIT_STORE: redis
      API_RATE_LIMIT_REDIS_PREFIX: ${API_RATE_LIMIT_REDIS_PREFIX:-vista:staging:rate-limit}
      API_TRUST_PROXY_HOPS: '2'
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Europe/Sofia}
      LOGISTICS_ECONT_BASE_URL: ${LOGISTICS_ECONT_BASE_URL:-https://demo.econt.com/ee/services}
      LOGISTICS_ECONT_USERNAME: ${LOGISTICS_ECONT_USERNAME:-}
      LOGISTICS_ECONT_PASSWORD: ${LOGISTICS_ECONT_PASSWORD:-}
      LOGISTICS_ECONT_SENDER_NAME: ${LOGISTICS_ECONT_SENDER_NAME:-}
      LOGISTICS_ECONT_SENDER_PHONE: ${LOGISTICS_ECONT_SENDER_PHONE:-}
      LOGISTICS_ECONT_SENDER_OFFICE_CODE: ${LOGISTICS_ECONT_SENDER_OFFICE_CODE:-}
      LOGISTICS_SPEEDY_BASE_URL: ${LOGISTICS_SPEEDY_BASE_URL:-https://api.speedy.bg/v1}
      LOGISTICS_SPEEDY_USERNAME: ${LOGISTICS_SPEEDY_USERNAME:-}
      LOGISTICS_SPEEDY_PASSWORD: ${LOGISTICS_SPEEDY_PASSWORD:-}
      LOGISTICS_SPEEDY_SERVICE_ID: ${LOGISTICS_SPEEDY_SERVICE_ID:-}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set the three public Vista origins in Coolify}
      DATABASE_URL: postgresql://vista:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}@postgres:5432/vista
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in Coolify}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Set TOTP_ENCRYPTION_KEY in Coolify}
      TOTP_ISSUER: ${TOTP_ISSUER:-Vista Service Staging}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: vista-storage
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in Coolify}
      S3_BUCKET: vista-files
      BACKUP_S3_BUCKET: vista-backups
      BACKUP_PRIMARY_DATABASE_SOURCE_CODE: ${BACKUP_PRIMARY_DATABASE_SOURCE_CODE:-VISTA-DB-01}
      BACKUP_DATABASE_SOURCE_URLS_JSON: ${BACKUP_DATABASE_SOURCE_URLS_JSON:-}
      BACKUP_PRIMARY_OBJECT_STORAGE_SOURCE_CODE: ${BACKUP_PRIMARY_OBJECT_STORAGE_SOURCE_CODE:-VISTA-FILES-01}
      BACKUP_OBJECT_STORAGE_SOURCE_CONFIGS_JSON: ${BACKUP_OBJECT_STORAGE_SOURCE_CONFIGS_JSON:-}
      BACKUP_EMAIL_SOURCE_CONFIGS_JSON: ${BACKUP_EMAIL_SOURCE_CONFIGS_JSON:-}
      BACKUP_WEBDAV_SOURCE_CONFIGS_JSON: ${BACKUP_WEBDAV_SOURCE_CONFIGS_JSON:-}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_RESTORE_DATABASE_URL: ${BACKUP_RESTORE_DATABASE_URL:-}
      BACKUP_FILE_SOURCE_ROOT: /protected-sources
      BACKUP_REPLICA_REQUIRED: ${BACKUP_REPLICA_REQUIRED:-false}
      BACKUP_REPLICA_TARGET_CODE: ${BACKUP_REPLICA_TARGET_CODE:-independent-vault}
      BACKUP_REPLICA_S3_ENDPOINT: ${BACKUP_REPLICA_S3_ENDPOINT:-}
      BACKUP_REPLICA_S3_REGION: ${BACKUP_REPLICA_S3_REGION:-us-east-1}
      BACKUP_REPLICA_S3_BUCKET: ${BACKUP_REPLICA_S3_BUCKET:-}
      BACKUP_REPLICA_S3_ACCESS_KEY_ID: ${BACKUP_REPLICA_S3_ACCESS_KEY_ID:-}
      BACKUP_REPLICA_S3_SECRET_ACCESS_KEY: ${BACKUP_REPLICA_S3_SECRET_ACCESS_KEY:-}
      BACKUP_REPLICA_S3_FORCE_PATH_STYLE: ${BACKUP_REPLICA_S3_FORCE_PATH_STYLE:-true}
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_FROM: staging@vista.local
      SMTP_TLS_MODE: none
      SMS_PROVIDER: ${SMS_PROVIDER:-disabled}
      BACKUP_ALERT_SMS_RECIPIENTS: ${BACKUP_ALERT_SMS_RECIPIENTS:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:-}
      TWILIO_API_BASE_URL: ${TWILIO_API_BASE_URL:-https://api.twilio.com}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      DEV_FIXTURES_ENABLED: 'false'
    volumes:
      - type: bind
        source: ${BACKUP_FILE_SOURCE_HOST_PATH:-/srv/vista/protected-sources}
        target: /protected-sources
        read_only: true
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      mailpit: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  operations:
    image: vista-operations:${VISTA_IMAGE_TAG:?Set VISTA_IMAGE_TAG in Coolify}
    build:
      context: .
      dockerfile: infrastructure/deployment/Dockerfile
      target: operations
      args:
        VITE_POS_APP_URL: ${VITE_POS_APP_URL:?Set the public Vista POS URL in Coolify}
    expose: ['8080']
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    depends_on:
      api: { condition: service_healthy }

  pos:
    image: vista-pos:${VISTA_IMAGE_TAG:?Set VISTA_IMAGE_TAG in Coolify}
    build: { context: ., dockerfile: infrastructure/deployment/Dockerfile, target: pos }
    expose: ['8080']
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    depends_on:
      api: { condition: service_healthy }

  recovery:
    image: vista-recovery:${VISTA_IMAGE_TAG:?Set VISTA_IMAGE_TAG in Coolify}
    build: { context: ., dockerfile: infrastructure/deployment/Dockerfile, target: recovery }
    expose: ['8080']
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  files-data:
